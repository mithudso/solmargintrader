[project]
name = "executor"
version = "0.1.0"
description = "Guarded spot-swap executor for Solana (Jupiter), with a semantic transaction verifier, rails and an append-only journal"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
dependencies = [
  "solders>=0.26,<0.28",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
executor = "executor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live Jupiter / Solana RPC / LI.FI (run with -m network)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # ruff format owns wrapping; long message strings stay readable
