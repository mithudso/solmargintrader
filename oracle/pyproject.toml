[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solmargintrader-oracle"
version = "0.2.1"
description = "Source-labelled prospective crypto signal archive and MCP service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["solmargintrader-backtester==0.1.1", "mcp==1.30.0"]

[project.scripts]
soloracle = "oracle.cli:main"
soloracle-mcp = "oracle.server:main"

[tool.setuptools]
packages = ["oracle"]
package-dir = {oracle = "."}
