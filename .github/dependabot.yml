# The extension has zero runtime and zero dev dependencies by design (see
# CLAUDE.md, House style), so there is deliberately no npm ecosystem entry: an
# npm updater for the extension would have nothing to update. The separate
# website uses pinned Wrangler development tooling and needs its own npm entry.
# Pinned action SHAs and Python requirements also need maintenance.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /backtester
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    # numpy and pandas move fast and the backtester asserts on numeric output;
    # a major bump needs the suite run by a human, not an auto-merge.
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /soltui
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /mongo
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # uv owns both pyproject.toml and uv.lock here.
  - package-ecosystem: uv
    directory: /liquidity
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # Each headless component declares its own third-party dependencies. Coupled
  # first-party version updates still require the repository's integration gates.
  - package-ecosystem: pip
    directory: /oracle
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /botmanager
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /ecosystem
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  - package-ecosystem: uv
    directory: /executor
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # Development tooling only; website has no runtime npm dependencies.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3
