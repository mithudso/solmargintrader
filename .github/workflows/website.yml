name: Website
on:
  pull_request:
    paths: ['website/**', 'extension/src/wallet/solana.js', '.github/workflows/website.yml']
  push:
    branches: [master, main]
    paths: ['website/**', 'extension/src/wallet/solana.js', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test && npm run check
        working-directory: website
      - run: node --test website/runtime/worker.test.js
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run test:browser
        working-directory: website
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: python -m pip install ./backtester ./oracle
      - run: python -m unittest website.engine.test_server website.engine.test_research website.engine.test_state website.engine.test_jobs website.engine.test_runtime website.engine.test_signals
      - run: python -m website.scripts.export_research --check
