name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_soltui_suite:
        description: Run the optional full SolTUI suite using four timed shards
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * *"

# Read-only by default; nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem:
    name: ecosystem (installed paper integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install all headless owners
        run: python -m pip install ./backtester ./oracle ./botmanager ./soltui ./ecosystem ruff
      - name: Bootstrap, telemetry, control room and owner contracts
        run: python -m unittest discover -s ecosystem/tests -t . -v
      - name: Packaged wiki matches tracked source documentation
        run: python scripts/build_ecosystem_wiki.py --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Control room and isolated swap JavaScript syntax
        run: |
          node --check ecosystem/web/app.js
          node --check ecosystem/web/swap.js
      - name: Installed headless imports and CLI
        working-directory: /tmp
        run: |
          python -I -c "import ecosystem, soltui.f5_batch, soltui.forwardtest, soltui.research_owner, soltui.manager_evidence, oracle, botmanager, botmanager.blind"
          solecosystem --help
          solecosystem-ui --help
      - name: Lint
        run: ruff check ecosystem oracle scripts/bootstrap_ecosystem.py scripts/build_ecosystem_wiki.py

  oracle:
    name: oracle (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install Oracle and canonical strategies
        run: python -m pip install ./backtester ./oracle ./botmanager ./soltui ruff
      - name: Oracle lifecycle, archive and MCP contracts
        run: python -m unittest discover -s oracle/tests -t . -v
      - name: Oracle lint
        run: ruff check oracle

  botmanager:
    name: botmanager (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install canonical simulation, headless strategy owner and standalone CLI
        run: python -m pip install ./backtester ./oracle ./soltui ./botmanager
      - name: CLI, runtime and recovery contracts
        env:
          INDEX_NO_AUTO: '1'
        run: python -m unittest discover -s botmanager/tests -t botmanager

  extension:
    name: extension (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Ed25519 in WebCrypto and node:test's current output both need a
          # recent runtime; 22 is the floor the test suite is verified on.
          node-version: '22'

      # No install step: the extension has zero runtime and zero dev
      # dependencies by design, so there is nothing to cache or audit.
      - name: Unit and parity tests
        run: node --test

      # A reload of an unpacked extension shows only the manifest version, so a
      # change that keeps it reads as "nothing changed" (2026-11-07, 0.1.0).
      - name: Version bumped when extension code changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet FETCH_HEAD HEAD -- src manifest.json; then exit 0; fi
          base=$(git show FETCH_HEAD:extension/manifest.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          head=$(node -p 'require("./manifest.json").version')
          if [ "$base" = "$head" ]; then
            echo "extension/src or manifest.json changed but the version is still $head."
            echo "Bump the version in extension/manifest.json and extension/package.json."
            exit 1
          fi

      - name: Syntax check every module
        run: |
          find src tools test -name '*.js' -print0 | xargs -0 -n1 node --check
          find e2e tools -name '*.mjs' -print0 | xargs -0 -n1 node --check

      - name: Validate the MV3 manifest
        run: |
          node -e "
            const m = require('./manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected MV3');
            for (const p of [m.background.service_worker, m.action.default_popup, m.options_page]) {
              if (!require('node:fs').existsSync(p)) throw new Error('manifest references missing file: ' + p);
            }
            console.log('manifest ok:', m.name, m.version);
          "

      - name: Headless dry run (offline, deterministic)
        run: node tools/dryrun.js --ticks 8 --osc 6 --offline 100

  # Loads the unpacked extension into a real Chrome for Testing and drives it over
  # the DevTools pipe (extension/tools/e2e.mjs). Dry-run only: it never arms or
  # signs, and every request but a stubbed price read is blocked, so it verifies
  # loading and dry-run behaviour, not live orders. Branded Chrome (preinstalled
  # on the runner) ignores command-line extension loading, so a Chrome for Testing
  # build is fetched. @puppeteer/browsers runs through npx only to download that
  # browser: it is not a dependency of the extension and is pinned for that reason.
  extension-e2e:
    name: extension (real browser e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install Chrome for Testing
        run: |
          out="$(npx --yes @puppeteer/browsers@3.2.6 install chrome@156.0.8078.47 --path "$RUNNER_TEMP/cft")"
          echo "$out"
          echo "CHROME=$(echo "$out" | tail -n1 | sed -E 's/^[^ ]+ //')" >> "$GITHUB_ENV"

      - name: Real-browser e2e (dry-run only)
        # No user namespaces on hosted runners, so Chrome's sandbox cannot start.
        run: E2E_NO_SANDBOX=1 node tools/e2e.mjs

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Install isolated managed-suite runtime
        run: |
          python -m venv "$RUNNER_TEMP/solbot-suite"
          "$RUNNER_TEMP/solbot-suite/bin/python" -m pip install ../backtester ../oracle ../soltui ../botmanager ../ecosystem
      - name: Chrome native helper and actual server recovery (paper only)
        env:
          INDEX_NO_AUTO: '1'
          SOLBOT_TEST_INSTALLED: '1'
          E2E_NO_SANDBOX: '1'
        run: SOLBOT_TEST_PYTHON="$RUNNER_TEMP/solbot-suite/bin/python" node tools/control-room-e2e.mjs

  backtester:
    name: backtester (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r backtester/requirements.txt

      - name: Unit tests
        run: python3 -m unittest discover -s backtester/tests -t . -v

      - name: Import check
        run: python3 -c "import backtester.cli; print('imports ok')"

      - name: Causal shape, cycle and frozen Volty diagnostics
        run: python3 -m unittest research.tests.test_shape_study research.tests.test_zec_cycles research.tests.test_volty_zec research.tests.test_volty_predictive_checks -v

      - name: Meta evidence consolidation and actual-cost replay contracts
        run: python3 -m unittest research.tests.test_meta_analysis research.tests.test_meta_followups -v

      - name: Top50 research correctness
        run: |
          pip install -r research/coinbase50-requirements.txt
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 python3 -m unittest research.tests.test_coinbase50_study -v

  # soltui is macOS-only (py2app, the menu-bar app and launchd have no Linux
  # equivalent), so this job runs on a macOS runner. It covers the unit suite
  # only: the packaging paths -- the alias bundle and the launchd agent -- are
  # verified by hand, per docs/known-issues.md.
  # Owner instruction: full SolTUI coverage is explicit opt-in. PR, push and
  # scheduled runs skip this job; a manual dispatch enables all timed shards.
  soltui:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_soltui_suite }}
    name: soltui (python, macos, shard ${{ matrix.shard }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip

      # soltui/tui.py imports backtester.core.indicators, which imports numpy,
      # so the backtester's requirements are a real dependency of this suite even
      # though soltui/requirements.txt scopes itself to soltui's own packages.
      # Without this the suite still "runs" -- discovery turns each failed import
      # into one _FailedTest, so it reports 54 tests instead of 187.
      - name: Install dependencies
        run: |
          pip install -r backtester/requirements.txt
          pip install -e executor
          grep -v '^macos-launchd-supervisor' soltui/requirements.txt > "$RUNNER_TEMP/soltui-req.txt"
          pip install -r "$RUNNER_TEMP/soltui-req.txt"  # private git dep: CI cannot clone it; its tests skip
          pip install ./backtester ./oracle ./soltui ./botmanager

      - name: Verify test selector
        run: python3 -m unittest scripts.test_soltui_ci

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Unit tests (sharded, timed)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 scripts/soltui_ci.py --shard ${{ matrix.shard }} --base "$PR_BASE"
          else
            python3 scripts/soltui_ci.py --shard ${{ matrix.shard }}
          fi

  # Bounded changed-area checks on PRs and direct pushes. Full coverage is opt-in.
  soltui-targeted:
    name: soltui (targeted macos)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r backtester/requirements.txt
          pip install -e executor
          grep -v '^macos-launchd-supervisor' soltui/requirements.txt > "$RUNNER_TEMP/soltui-req.txt"
          pip install -r "$RUNNER_TEMP/soltui-req.txt"
      - name: Verify selector
        run: python3 -m unittest scripts.test_soltui_ci
      - name: Install headless research owners for actual macOS judge checks
        run: python -m pip install ./backtester ./oracle ./soltui ./botmanager
      - name: Actual operating-system judge isolation
        run: python -m unittest discover -s botmanager/tests -t botmanager -p test_blind.py
      - name: Actual optimizer and stalled-writer capacity under macOS isolation
        run: python -m unittest discover -s botmanager/tests -t botmanager -p test_load.py
      - name: Changed-area tests and bridge smoke
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 scripts/soltui_ci.py --targeted --base "$BASE" --shard 0 --shards 1
          else
            python3 scripts/soltui_ci.py --targeted --shard 0 --shards 1
          fi

  # The mongo tests skip themselves when no server is listening, which would make
  # this job silently vacuous. A service container is the point: it makes the
  # integration half -- strict validation, provenance, and above all the
  # idempotency check -- actually run.
  mongo:
    name: mongo (python)
    # MongoDB refuses to start on Linux kernel 6.19+ (SERVER-121912), which ubuntu-24.04 runners now ship.
    # The 22.04 image is on an older kernel. Move back to ubuntu-latest once mongo:8 carries the fix.
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        # The backtester's deps too: the loader imports it to read bars and to
        # reuse checksum_frame.
        run: |
          pip install -r mongo/requirements.txt
          pip install -r backtester/requirements.txt

      - name: Layout describes itself without a server
        run: python3 mongo/schema.py --describe

      - name: Unit and integration tests
        env:
          SOLMARGINTRADER_MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: python3 -m unittest discover -s mongo/tests -t .

      - name: Raw event capture durability and upload boundaries
        env:
          SOLMARGINTRADER_MONGO_TEST_URI: mongodb://127.0.0.1:27017
        run: python3 -m unittest discover -s scripts -p test_capture_market.py -v

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Read-only query regression fixtures
        run: node mongo/tests/query_regressions.cjs

  # Documentation drift is a build failure, not a nit: the docs claimed 250
  # backtester tests for several commits while the suite had grown to 454, and
  # nothing caught it. Counts come from unittest discovery rather than from
  # running the suites, so this job is still cheap -- but it is NOT dependency
  # free, which is what it used to claim. Discovery imports each test module, and
  # an ImportError collapses a whole module into a single _FailedTest, so a
  # depless runner counted 33 backtester tests instead of 499 and the check
  # failed against docs that were in fact correct.
  docs:
    name: docs (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip

      # Node is pinned for the same reason the extension job pins it, and because
      # `check_docs.py` asks `node --test` for the extension count rather than
      # trusting a source regex.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # Counting is by unittest DISCOVERY, which imports each test module -- so the
      # suites' own dependencies are required here even though no test runs. Without
      # them every backtester module fails to import, each becomes a single
      # `_FailedTest`, and the count collapses to a handful: this job would then
      # report drift against docs that are correct. Verified by running it in a bare
      # virtualenv.
      - name: Install the suites' dependencies
        run: |
          pip install -r backtester/requirements.txt
          pip install -e executor
          grep -v '^macos-launchd-supervisor' soltui/requirements.txt > "$RUNNER_TEMP/soltui-req.txt"
          pip install -r "$RUNNER_TEMP/soltui-req.txt"  # private git dep: CI cannot clone it; its tests skip
          pip install ./backtester ./oracle ./soltui ./botmanager
          pip install -r mongo/requirements.txt

      - name: Test counts and retrieval indexes agree with the repo
        run: python3 scripts/check_docs.py

      - name: Offline HTML converter behavior
        run: python3 -m unittest scripts.test_html_to_markdown

      - name: Workflow publication and source-bound tool safety
        run: |
          python3 -m unittest scripts.test_workflow_safety scripts.test_maintenance_tools
          node --test scripts/test_workflow_rotation.mjs

      - name: MCP credential and endpoint boundaries
        run: python3 -m unittest scripts.test_mcp_remote_client

      - name: TradingView source-to-card coverage is consistent
        run: python3 scripts/check_tradingview_cards.py

      - name: Strategy publication cards and evidence receipts agree
        run: python3 scripts/check_tradingview_strategy_profiles.py

      - name: Script interpretation review gate refuses stale evidence
        run: python3 -m unittest scripts.test_tradingview_script_profiles

      - name: Full script source cards and review receipts agree
        run: python3 scripts/render_tradingview_script_cards.py check

      - name: Incomplete card separation integrity
        run: python3 -m unittest scripts.test_card_readiness

      # The exhaustive index under index/ is a separate artifact from
      # docs/high_signal_file_index.json above, and it goes stale the same way: it
      # looks authoritative, and nothing notices when a file moves. --check
      # re-hashes every tracked source file against the committed index. No
      # dependencies, no network.
      - name: Repository index is not stale
        run: python3 index/build.py --check

  # Live Jupiter endpoints are checked on a schedule rather than per-commit: a
  # third-party outage must not turn every PR red.
  endpoints:
    name: jupiter endpoints (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: node tools/verify-endpoints.js

  # liquidity/ manages Aero LP positions on Base. It has its own pyproject + lock (web3 lives only here),
  # so it gets its own job, the same way the extension does. Network tests (-m network) are excluded by
  # default and are run by hand: they read live chain state.
  liquidity:
    name: liquidity (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liquidity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev -p 3.13
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q

  # executor/ signs and sends real Jupiter swaps on Solana. It has its own pyproject + lock (solders lives only
  # here), so it gets its own job, like liquidity. Network tests (-m network) are excluded by default: they
  # read live Jupiter, LI.FI and Solana RPC state and are run by hand.
  executor:
    name: executor (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --extra dev -p 3.13 --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
