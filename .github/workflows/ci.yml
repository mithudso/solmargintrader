name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Read-only by default; nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Ed25519 in WebCrypto and node:test's current output both need a
          # recent runtime; 22 is the floor the test suite is verified on.
          node-version: '22'

      # No install step: the extension has zero runtime and zero dev
      # dependencies by design, so there is nothing to cache or audit.
      - name: Unit and parity tests
        run: node --test

      - name: Syntax check every module
        run: |
          find src tools test -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate the MV3 manifest
        run: |
          node -e "
            const m = require('./manifest.json');
            if (m.manifest_version !== 3) throw new Error('expected MV3');
            for (const p of [m.background.service_worker, m.action.default_popup, m.options_page]) {
              if (!require('node:fs').existsSync(p)) throw new Error('manifest references missing file: ' + p);
            }
            console.log('manifest ok:', m.name, m.version);
          "

      - name: Headless dry run (offline, deterministic)
        run: node tools/dryrun.js --ticks 8 --osc 6 --offline 100

  backtester:
    name: backtester (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r backtester/requirements.txt

      - name: Unit tests
        run: python3 -m unittest discover -s backtester/tests -t . -v

      - name: Import check
        run: python3 -c "import backtester.cli; print('imports ok')"

  # soltui is macOS-only (py2app, the menu-bar app and launchd have no Linux
  # equivalent), so this job runs on a macOS runner. It covers the unit suite
  # only: the packaging paths -- the alias bundle and the launchd agent -- are
  # verified by hand, per docs/known-issues.md.
  soltui:
    name: soltui (python, macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      # soltui/tui.py imports backtester.core.indicators, which imports numpy,
      # so the backtester's requirements are a real dependency of this suite even
      # though soltui/requirements.txt scopes itself to soltui's own packages.
      # Without this the suite still "runs" -- discovery turns each failed import
      # into one _FailedTest, so it reports 54 tests instead of 187.
      - name: Install dependencies
        run: |
          pip install -r backtester/requirements.txt
          pip install -r soltui/requirements.txt

      - name: Unit tests
        run: python3 -m unittest discover -s soltui/tests -t .

  # Documentation drift is a build failure, not a nit: the docs claimed 250
  # backtester tests for several commits while the suite had grown to 454, and
  # nothing caught it. Counts come from unittest discovery rather than from
  # running the suites, so this job is still cheap -- but it is NOT dependency
  # free, which is what it used to claim. Discovery imports each test module, and
  # an ImportError collapses a whole module into a single _FailedTest, so a
  # depless runner counted 33 backtester tests instead of 499 and the check
  # failed against docs that were in fact correct.
  docs:
    name: docs (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r backtester/requirements.txt
          pip install -r soltui/requirements.txt

      - name: Test counts and retrieval indexes agree with the repo
        run: python3 scripts/check_docs.py

      # The exhaustive index under index/ is a separate artifact from
      # docs/high_signal_file_index.json above, and it goes stale the same way: it
      # looks authoritative, and nothing notices when a file moves. --check
      # re-hashes every tracked source file against the committed index. No
      # dependencies, no network.
      - name: Repository index is not stale
        run: python3 index/build.py --check

  # Live Jupiter endpoints are checked on a schedule rather than per-commit: a
  # third-party outage must not turn every PR red.
  endpoints:
    name: jupiter endpoints (informational)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/verify-endpoints.js
