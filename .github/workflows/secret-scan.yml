name: Secret scan
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history: a key removed from HEAD is still exposed in an old commit.
          fetch-depth: 0
      # Same pinned, checksum-verified binary and policy a developer runs locally.
      - run: scripts/secret_scan.sh all
