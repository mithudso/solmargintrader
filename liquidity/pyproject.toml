[project]
name = "aero-lp"
version = "0.1.0"
description = "Cost-aware auto-rebalancer for Aero (aero.xyz) Slipstream concentrated-liquidity deposits on Base"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
dependencies = [
  "web3>=7.6,<9",
  "eth-account>=0.13",
  "hexbytes>=1.2",
  "requests>=2.31",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aero-lp = "aero_lp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aero_lp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits live Base RPC / public APIs (run with -m network)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
