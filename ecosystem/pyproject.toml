[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solmargintrader-ecosystem"
version = "0.3.0"
description = "Resumable headless paper-research bootstrap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["solmargintrader-oracle==0.2.2", "solbot-manager==0.6.0", "solmargintrader-research-runtime==0.3.0"]

[project.scripts]
solecosystem = "ecosystem.cli:main"
solecosystem-ui = "ecosystem.web:main"

[tool.setuptools]
packages = ["ecosystem"]
package-dir = {ecosystem = "."}

[tool.setuptools.package-data]
ecosystem = ["web/*.html", "web/*.css", "web/*.js", "wiki_content/*.json", "api/*.json"]
