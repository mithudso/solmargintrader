[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solbot-manager"
version = "0.6.0"
description = "Persistent paper bot specifications and owner-aware inventory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["solmargintrader-backtester==0.2.0", "solmargintrader-research-runtime==0.3.0", "solmargintrader-oracle==0.2.2"]

[project.scripts]
solbot = "botmanager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
