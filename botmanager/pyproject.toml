[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solbot-manager"
version = "0.4.0"
description = "Persistent paper bot specifications and owner-aware inventory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["solmargintrader-backtester==0.1.1", "solmargintrader-research-runtime==0.1.2", "solmargintrader-oracle==0.2.1"]

[project.scripts]
solbot = "botmanager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
