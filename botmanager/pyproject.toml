[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solbot-manager"
version = "0.2.2"
description = "Persistent paper bot specifications and owner-aware inventory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["solmargintrader-backtester==0.1.0"]

[project.scripts]
solbot = "botmanager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
